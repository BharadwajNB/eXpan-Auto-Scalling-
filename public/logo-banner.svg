<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c17" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="bannerBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.6" />
    </linearGradient>

    <!-- Text Brand Gradient -->
    <linearGradient id="brandText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow -->
    <filter id="bgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Banner Container -->
  <rect x="2" y="2" width="536" height="96" rx="20" fill="url(#bannerBg)" stroke="url(#bannerBorder)" stroke-width="1.5" />

  <!-- Embedded Icon Mark (Scale & Positioned on Left) -->
  <g transform="translate(20, 10)">
    <!-- Sub-Squircle -->
    <rect x="0" y="0" width="80" height="80" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Top Ingress Node -->
    <circle cx="40" cy="18" r="4.5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" filter="url(#bgGlow)" />
    <circle cx="40" cy="18" r="1.8" fill="#38bdf8" />
    <path d="M40 23 V 31" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />

    <!-- Central Routing Router -->
    <polygon points="40,31 45,35 40,39 35,35" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="40" cy="35" r="1.5" fill="#ffffff" />
    <path d="M35 35 H 20 V 44" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M45 35 H 60 V 44" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M40 39 V 44" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Center Primary Server Blade -->
    <rect x="27" y="44" width="26" height="9" rx="2.5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="31" cy="48.5" r="1.2" fill="#10b981" />
    <rect x="35" y="47.5" width="10" height="2" rx="1" fill="#38bdf8" />

    <!-- Left Auto-Scaled Node -->
    <rect x="10" y="55" width="22" height="8" rx="2.5" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="14" cy="59" r="1" fill="#10b981" />
    <rect x="18" y="58" width="8" height="2" rx="1" fill="#818cf8" />

    <!-- Right Auto-Scaled Node -->
    <rect x="48" y="55" width="22" height="8" rx="2.5" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="52" cy="59" r="1" fill="#10b981" />
    <rect x="56" y="58" width="8" height="2" rx="1" fill="#818cf8" />

    <!-- Dynamic Elastic Scale Bracket -->
    <path d="M12 68 H68" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 2" />
    <circle cx="12" cy="68" r="1.5" fill="#38bdf8" />
    <circle cx="40" cy="68" r="2" fill="#818cf8" />
    <circle cx="68" cy="68" r="1.5" fill="#38bdf8" />
  </g>

  <!-- Typography Brand Header -->
  <g transform="translate(122, 22)">
    <!-- Main Title -->
    <text x="0" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5" fill="#ffffff">
      e<tspan fill="url(#brandText)">X</tspan>pan
    </text>

    <!-- Version / Status Badge -->
    <g transform="translate(118, 12)">
      <rect x="0" y="0" width="84" height="20" rx="10" fill="#0369a1" fill-opacity="0.25" stroke="#0ea5e9" stroke-width="1" />
      <circle cx="10" cy="10" r="3" fill="#10b981" filter="url(#bgGlow)" />
      <text x="20" y="14" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="0.5">ELASTIC</text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="0" y="54" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#94a3b8" letter-spacing="1.2">
      CLOUD INFRASTRUCTURE &amp; AUTO-SCALING PLATFORM
    </text>
  </g>

  <!-- Decorative Metric Pill on Far Right -->
  <g transform="translate(436, 32)">
    <rect x="0" y="0" width="80" height="36" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="40" y="16" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b" font-weight="600">SCALE LOOP</text>
    <text x="40" y="28" text-anchor="middle" font-family="monospace" font-size="11" fill="#10b981" font-weight="bold">ACTIVE 2s</text>
  </g>
</svg>

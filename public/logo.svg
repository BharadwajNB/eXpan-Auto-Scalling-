<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <!-- Primary Accent Gradient (Cyan to Indigo) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Elastic Expansion Gradient (Cyan/Teal to Electric Blue) -->
    <linearGradient id="elasticGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Server Blade Gradient -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="6" y="6" width="188" height="188" rx="42" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Background Circuit Grid Lines -->
  <path d="M40 100 H160 M100 40 V160" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />
  <circle cx="100" cy="100" r="54" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 4" fill="none" opacity="0.5" />

  <!-- Top Ingress Traffic Gateway (Layer 7 Ingress Node) -->
  <g transform="translate(100, 38)">
    <circle cx="0" cy="0" r="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" />
    <circle cx="0" cy="0" r="4" fill="#38bdf8" />
    <!-- Downward Traffic Flow Beam -->
    <path d="M0 10 V 28" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="-3,26 3,26 0,31" fill="#38bdf8" />
  </g>

  <!-- Horizontal Auto-Scaling Blades & Elastic Expansion Core -->
  <!-- Middle Tier: Central Load Balancer Router -->
  <g transform="translate(100, 78)">
    <!-- Distributor Node -->
    <polygon points="0,-8 10,0 0,8 -10,0" fill="#1e293b" stroke="#818cf8" stroke-width="2" />
    <circle cx="0" cy="0" r="2.5" fill="#a5b4fc" />

    <!-- Branching Traffic Channels to Worker Instances -->
    <path d="M-8 0 H-42 V16" stroke="#6366f1" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M0 8 V16" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M8 0 H42 V16" stroke="#6366f1" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Worker Compute Instances (3 Horizontal Scalable Blades) -->
  <!-- Center Instance (Base Node) -->
  <g transform="translate(70, 100)">
    <rect x="0" y="0" width="60" height="18" rx="4" fill="url(#bladeGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Status LEDs -->
    <circle cx="8" cy="9" r="2.5" fill="#10b981" filter="url(#glow)" />
    <!-- CPU Activity Vent Bars -->
    <rect x="18" y="7" width="22" height="4" rx="2" fill="#334155" />
    <rect x="18" y="7" width="14" height="4" rx="2" fill="#38bdf8" />
    <circle cx="50" cy="9" r="2" fill="#64748b" />
  </g>

  <!-- Left Instance (Scale-Out Blade #1) -->
  <g transform="translate(24, 126)">
    <rect x="0" y="0" width="46" height="16" rx="4" fill="url(#bladeGrad)" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="7" cy="8" r="2" fill="#10b981" />
    <rect x="15" y="6" width="18" height="4" rx="2" fill="#334155" />
    <rect x="15" y="6" width="10" height="4" rx="2" fill="#818cf8" />
    <circle cx="38" cy="8" r="1.5" fill="#64748b" />
  </g>

  <!-- Right Instance (Scale-Out Blade #2) -->
  <g transform="translate(130, 126)">
    <rect x="0" y="0" width="46" height="16" rx="4" fill="url(#bladeGrad)" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="7" cy="8" r="2" fill="#10b981" />
    <rect x="15" y="6" width="18" height="4" rx="2" fill="#334155" />
    <rect x="15" y="6" width="12" height="4" rx="2" fill="#818cf8" />
    <circle cx="38" cy="8" r="1.5" fill="#64748b" />
  </g>

  <!-- Dynamic Elastic Auto-Scaling Expansion Vectors (The "X" / Expansion Motion) -->
  <!-- Left Expansion Arrow (Scale-In / Scale-Out Elasticity) -->
  <g transform="translate(20, 109)">
    <path d="M8 0 L0 0 M3 -3 L0 0 L3 3" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <!-- Right Expansion Arrow -->
  <g transform="translate(172, 109)">
    <path d="M0 0 L8 0 M5 -3 L8 0 L5 3" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Horizontal Auto-Scaling Dynamic Range Bracket (Bottom) -->
  <g transform="translate(100, 162)">
    <path d="M-65 -4 V2 H65 V-4" stroke="url(#elasticGrad)" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <!-- Dynamic Range Nodes (Min, Desired, Max) -->
    <circle cx="-65" cy="2" r="3" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="0" cy="2" r="3.5" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="65" cy="2" r="3" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" />
    <!-- Dynamic Pulsing Center Dot -->
    <circle cx="0" cy="2" r="1.5" fill="#ffffff" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="favBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#favBg)" stroke="url(#favBorder)" stroke-width="2" />

  <!-- Ingress Gateway -->
  <circle cx="32" cy="14" r="3.5" fill="#38bdf8" />
  <path d="M32 18 V 24" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />

  <!-- Router Distribution -->
  <polygon points="32,24 36,28 32,32 28,28" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" />
  <path d="M28 28 H 18 V 35" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <path d="M36 28 H 46 V 35" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <path d="M32 32 V 35" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none" />

  <!-- Primary Blade -->
  <rect x="22" y="35" width="20" height="7" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <circle cx="25" cy="38.5" r="1" fill="#10b981" />

  <!-- Left/Right Scaled Blades -->
  <rect x="10" y="44" width="16" height="6" rx="1.5" fill="#1e293b" stroke="#6366f1" stroke-width="1" />
  <circle cx="13" cy="47" r="0.8" fill="#10b981" />

  <rect x="38" y="44" width="16" height="6" rx="1.5" fill="#1e293b" stroke="#6366f1" stroke-width="1" />
  <circle cx="41" cy="47" r="0.8" fill="#10b981" />

  <!-- Elastic Expansion Bracket -->
  <path d="M12 53 H 52" stroke="#38bdf8" stroke-width="1" stroke-dasharray="1.5 1.5" stroke-linecap="round" />
</svg>
